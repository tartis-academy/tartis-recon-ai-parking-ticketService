# Postgres dedicado de ticket-service (database-per-service, perfil prod o
# servicio aislado). El Postgres compartido del dia a dia en dev vive en el
# repo de infra (./setup.sh). Ver Convenciones del proyecto Parking S4.
#
#   docker network create parking-shared   (una vez)

services:
  postgres:
    image: postgres:15.18-alpine
    container_name: parking-ticket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TICKET_DB_USER}
      POSTGRES_PASSWORD: ${TICKET_DB_PASSWORD}
      POSTGRES_DB: ${TICKET_DB_NAME}
    ports:
      - "${TICKET_DB_PORT:-5436}:5432"
    volumes:
      - parking-ticket-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TICKET_DB_USER} -d ${TICKET_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - parking-shared

volumes:
  parking-ticket-postgres-data:

networks:
  parking-shared:
    external: true
