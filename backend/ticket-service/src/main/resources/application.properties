spring.application.name=ticket-service

spring.config.import=optional:file:.env[.properties]

spring.profiles.default=dev

spring.jpa.open-in-view=false

spring.docker.compose.enabled=false

# RECON-812: las Postgres de demo/prod ya tenian tablas creadas por el
# schema.sql que se montaba como init script. baseline-on-migrate hace que,
# si Flyway encuentra un esquema no vacio sin su tabla de historial, marque
# V1 como ya aplicada en vez de fallar con "relation already exists".
spring.flyway.baseline-on-migrate=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
# GW-06: mete el correlation-id del MDC (lo pone CorrelationIdFilter) en cada
# linea de log. Sin esta linea el filtro funciona pero el identificador no se
# ve por ningun sitio, que es todo el objetivo del ticket.
#
# El patron por defecto de consola de Spring Boot ya reserva un hueco para
# esto, asi que basta con rellenarlo y no hay que redefinir el patron entero
# (que costaria los colores y el formato de Boot). El :- deja el hueco en
# blanco si la clave no esta, para que las lineas de arranque no salgan con un
# "null" delante.
logging.pattern.correlation=[${spring.application.name:ticket-service}] [%X{correlationId:-}]

springdoc.swagger-ui.url=/openapi.yml

spring.rabbitmq.host=rabbitmq
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Timeout de bloqueo pesimista (2 s).
# En PostgreSQL, jakarta.persistence.lock.timeout NO es efectiva (solo aplica en Oracle
# con FOR UPDATE WAIT n). El timeout real se configura a nivel de sesión vía Hikari:
spring.datasource.hikari.connection-init-sql=SET lock_timeout = 2000

# Dead letters de rabbitMQ: Reintentos con Backoff Exponencial y límite máximo de intentos
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=6
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000ms
spring.rabbitmq.listener.simple.concurrency=3
spring.rabbitmq.listener.simple.max-concurrency=5
