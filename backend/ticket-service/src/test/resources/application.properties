spring.datasource.url=jdbc:postgresql://${TICKET_DB_HOST:localhost}:${TICKET_DB_PORT:5436}/${TICKET_DB_NAME:ticket_db}
spring.datasource.username=${TICKET_DB_USER:ticket_user}
spring.datasource.password=${TICKET_DB_PASSWORD:change.me}

spring.jpa.hibernate.ddl-auto=create-drop

# Hibernate ya crea y destruye el esquema en cada run; Flyway no aporta nada
# aqui y solo anadiria una flyway_schema_history de mas.
spring.flyway.enabled=false
