spring.datasource.url=jdbc:postgresql://${TICKET_DB_HOST:localhost}:${TICKET_DB_PORT:5436}/${TICKET_DB_NAME:ticket_db}
spring.datasource.username=${TICKET_DB_USER:ticket_user}
spring.datasource.password=${TICKET_DB_PASSWORD:change.me}

spring.jpa.hibernate.ddl-auto=validate

# Habilitar Flyway para validar que las migraciones V1__init.sql construyen el esquema real de BD
spring.flyway.enabled=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/parking

# Timeout de bloqueo pesimista (2 s).
# En PostgreSQL, jakarta.persistence.lock.timeout NO es efectiva (solo aplica en Oracle
# con FOR UPDATE WAIT n). El timeout real se configura a nivel de sesión vía Hikari:
spring.datasource.hikari.connection-init-sql=SET lock_timeout = 2000
