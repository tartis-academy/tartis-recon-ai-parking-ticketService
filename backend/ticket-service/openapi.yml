openapi: 3.0.3
info:
  title: ticket-service API
  description: >
    Generates the exit/payment ticket when stay-service calls it during
    check-out (POST /v1/tickets). This is the "Ticket" domain entity
    (IN-20: 1:1 with Stay) — distinct from the EntryTicket issued at
    check-in, which is generated and owned by stay-service itself, not by
    this service.

    GAP FLAGGED: the mandatory user stories (HU-01..HU-08, per
    Ejercicio_inicial_en_grupo.docx) do not include a "Gestionar tickets"
    story. Ticket querying (GET) and the lost-ticket flow below are
    inferred only from invariants IN-20/IN-21/IN-22 and the edge-case notes
    in Bocetos_Sesión_1.pdf, not from an explicit HU/RN. In particular,
    IN-22 ("a Ticket marked lost is always billed at a penalty rate,
    never the normal tariff") has no RN defining the penalty rate value or
    who calculates it — confirm scope and pricing source with the team
    before implementing PATCH /tickets/{ticketId}/lost.

    Admin endpoints are unauthenticated in Phase 1 (HU-07 / RN-02 out of
    scope, see bearerAuth scheme below).
  version: 1.0.0
  contact:
    name: TARTIS Recon-AI - Team Parking

servers:
  - url: /v1

tags:
  - name: tickets
    description: Exit ticket generation and query

paths:
  /tickets:
    post:
      tags: [tickets]
      operationId: createTicket
      summary: >
        Generates the exit ticket for a finished stay. Called synchronously
        by stay-service as part of the check-out sequence (before spot
        release).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreateRequest'
      responses:
        '201':
          description: Ticket generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: A ticket already exists for this stayId (IN-20, 1:1)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [tickets]
      operationId: listTickets
      summary: Lists tickets, optionally filtered by stay (inferred, see GAP note)
      parameters:
        - name: stayId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Page of tickets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /tickets/{ticketId}:
    get:
      tags: [tickets]
      operationId: getTicket
      summary: Retrieves a ticket by ID (inferred, see GAP note)
      parameters:
        - $ref: '#/components/parameters/TicketIdPath'
      responses:
        '200':
          description: Ticket detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /tickets/{ticketId}/lost:
    patch:
      tags: [tickets]
      operationId: markTicketLost
      summary: >
        Marks a ticket as LOST (IN-22). A LOST ticket is never recalculated
        with the normal tariff; a penalty rate applies instead. Penalty
        rate source is undefined in current docs (see GAP note above).
      parameters:
        - $ref: '#/components/parameters/TicketIdPath'
      responses:
        '200':
          description: Ticket marked as lost
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Ticket is already LOST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  schemas:

    TicketStatus:
      type: string
      enum: [VALID, LOST]

    Ticket:
      type: object
      properties:
        ticketId:
          type: string
          format: uuid
        stayId:
          type: string
          format: uuid
          description: 1:1 with Stay (IN-20)
        plate:
          type: string
        checkIn:
          type: string
          format: date-time
        checkOut:
          type: string
          format: date-time
        totalMinutes:
          type: integer
        amount:
          type: number
          format: double
        status:
          $ref: '#/components/schemas/TicketStatus'
        issuedAt:
          type: string
          format: date-time

    TicketCreateRequest:
      type: object
      required: [stayId, plate, checkIn, checkOut, totalMinutes, amount]
      properties:
        stayId:
          type: string
          format: uuid
        plate:
          type: string
        checkIn:
          type: string
          format: date-time
        checkOut:
          type: string
          format: date-time
        totalMinutes:
          type: integer
        amount:
          type: number
          format: double

    TicketResponse:
      $ref: '#/components/schemas/Ticket'

    TicketPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 409
        error:
          type: string
          example: "CONFLICT"
        message:
          type: string
          example: "A ticket already exists for stay 7f0b57d2-..."
        path:
          type: string
          example: "/v1/tickets"

  parameters:
    TicketIdPath:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid request (field validation)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Ticket not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
