openapi: 3.0.3
info:
  title: ticket-service API
  version: 1.1.0
  description: >
    Manages the "Ticket" domain entity (IN-20: 1:1 with Stay), the exit /
    payment ticket generated when stay-service calls during check-out, as
    well as the "EntryTicket" subdomain (the entry ticket issued at
    check-in, which stay-service delegates to this service).

    No SSE stream is exposed by this service yet: ticket-service does not
    publish events to the shared exchange today (see the ticket-service
    ADR), so there is no real-time stream to document here.

    All operations require a JWT (bearerAuth scheme below). Roles are
    enforced per method via @PreAuthorize (SEC-10 / SEC-11):
    ADMIN / OPERARIO for creation, ADMIN for listing and update, and
    USER / ADMIN / OPERARIO for single-ticket reads.
  contact:
    name: TARTIS Recon-AI - Team Parking

servers:
  - url: /v1

tags:
  - name: tickets
    description: Exit ticket generation and query
  - name: entry-tickets
    description: Entry ticket (issued at check-in) management

# Todas las operaciones requieren token JWT (bearerAuth). Solo el health check
# de actuator (/actuator/health) es publico y queda fuera de este contrato.
# SEC-13: securityScheme aplicado a nivel de documento.
security:
  - bearerAuth: []

paths:
  /tickets:
    post:
      tags: [tickets]
      operationId: createTicket
      summary: >
        Generates the exit ticket for a finished stay. Called synchronously
        by stay-service as part of the check-out sequence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketRequest'
      responses:
        '201':
          description: Ticket generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: A ticket already exists for this stayId (IN-20, 1:1)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [tickets]
      operationId: listTickets
      summary: Lists tickets, optionally filtered by a search term
      parameters:
        - name: search
          in: query
          required: false
          description: Optional free-text search over the ticket fields
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Page of tickets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /tickets/{id}:
    get:
      tags: [tickets]
      operationId: getTicket
      summary: Retrieves a ticket by ID
      parameters:
        - $ref: '#/components/parameters/TicketIdPath'
      responses:
        '200':
          description: Ticket detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /entry-tickets:
    get:
      tags: [entry-tickets]
      operationId: listEntryTickets
      summary: Lists all entry tickets (admin)
      responses:
        '200':
          description: List of entry tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntryTicketResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [entry-tickets]
      operationId: createEntryTicket
      summary: Creates an entry ticket for a stay (issued at check-in)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryTicketRequest'
      responses:
        '201':
          description: Entry ticket created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryTicketResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: An entry ticket already exists for this stayId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /entry-tickets/{id}/code:
    get:
      tags: [entry-tickets]
      operationId: getEntryTicket
      summary: Retrieves an entry ticket by ID (recovery of its barcode/code)
      parameters:
        - $ref: '#/components/parameters/EntryTicketIdPath'
      responses:
        '200':
          description: Entry ticket detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryTicketResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /entry-tickets/{id}:
    put:
      tags: [entry-tickets]
      operationId: updateEntryTicket
      summary: Updates an entry ticket (admin)
      parameters:
        - $ref: '#/components/parameters/EntryTicketIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryTicketRequest'
      responses:
        '200':
          description: Entry ticket updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryTicketResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  schemas:

    TicketRequest:
      type: object
      required: [stayId]
      properties:
        stayId:
          type: string
          format: uuid
        totalAmount:
          type: number
          format: double

    TicketPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/TicketResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    TicketResponse:
      type: object
      properties:
        uniqueId:
          type: string
          format: uuid
        stayId:
          type: string
          format: uuid
          description: 1:1 with Stay (IN-20)
        issuedAt:
          type: string
          format: date-time
        totalAmount:
          type: number
          format: double

    EntryTicketRequest:
      type: object
      required: [stayId]
      properties:
        stayId:
          type: string
          format: uuid

    EntryTicketResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        stayId:
          type: string
          format: uuid
        issuedAt:
          type: string
          format: date-time
        code:
          type: string
          description: Barcode of the entry ticket

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 409
        error:
          type: string
          example: "CONFLICT"
        message:
          type: string
          example: "A ticket already exists for stay 7f0b57d2-..."
        path:
          type: string
          example: "/v1/tickets"

  parameters:
    TicketIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EntryTicketIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid request (field validation)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Token ausente, inválido o caducado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: El token es válido pero el rol no autoriza la operación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT