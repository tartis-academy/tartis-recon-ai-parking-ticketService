# BD dedicada del microservicio (database-per-service).
spring.datasource.url=jdbc:postgresql://${TICKET_DB_HOST}:${TICKET_DB_PORT:5432}/${TICKET_DB_NAME:ticket_db}
spring.datasource.username=${TICKET_DB_USER}
spring.datasource.password=${TICKET_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.devtools.restart.enabled=false
