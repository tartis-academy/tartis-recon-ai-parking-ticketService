name: CI

on:
  pull_request:
    branches: [main, release]
  push:
    branches: [main, release]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/ticket-service

    services:
      # Postgres desechable, solo para este job. No tiene relacion con el
      # docker-compose.yml del repo: spring-boot-docker-compose esta
      # desactivado durante los tests (spring.docker.compose.skip.in-tests).
      #
      # Hace falta porque TicketServiceApplicationTests es un @SpringBootTest:
      # levanta el contexto entero, JPA incluido, y sin DataSource real no arranca.
      #
      # Usuario, password y base deben coincidir con las variables TICKET_DB_*
      # del paso "Build + test", que son las que lee
      # src/test/resources/application.properties.
      postgres:
        image: postgres:15.18-alpine
        env:
          POSTGRES_USER: ticket_user
          POSTGRES_PASSWORD: ticket_pass
          POSTGRES_DB: ticket_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticket_user -d ticket_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: SonarCloud lo necesita para calcular el
          # "new code" (blame por commit) al evaluar el quality gate.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          # El pom compila a bytecode 17 (maven.compiler source/target) pero el
          # runner usa 21: SonarQube Cloud dejo de soportar analizar con JDK 17
          # desde julio 2026. Lombok 1.18.30 soporta 21 sin problema (el limite
          # documentado es JDK 25).
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # verify ya compila: no hace falta un paso de compile aparte.
      # jacoco-maven-plugin (pom.xml) genera target/site/jacoco/jacoco.xml
      # en esta misma fase, que es el reporte que consume SonarCloud.
      - name: Build + test
        env:
          TICKET_DB_HOST: localhost
          # El service container expone el 5432 directo. El 5436 del compose es
          # solo el mapeo en local para no chocar con otros Postgres.
          TICKET_DB_PORT: 5432
          TICKET_DB_NAME: ticket_db
          TICKET_DB_USER: ticket_user
          TICKET_DB_PASSWORD: ticket_pass
        run: ./mvnw -B verify

      - name: Cache paquetes de SonarCloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Requiere el secret SONAR_TOKEN del repo.
      # qualitygate.wait=false (temporal, RECON): con el dominio recien
      # empezando a tener tests, el gate de codigo nuevo de SonarCloud (fuera
      # de este repo, configurado en sonarcloud.io) puede seguir fallando
      # aunque el build local pase el umbral de JaCoCo. El analisis se sigue
      # subiendo y quedando visible en el dashboard, solo deja de bloquear el
      # merge. Volver a wait=true cuando la cobertura este mas cerca del
      # umbral real del proyecto.
      - name: Analisis SonarCloud (quality gate)
        continue-on-error: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw -B sonar:sonar
          -Dsonar.projectKey=1dd0rv_tartis-recon-ai-parking-ticketService
          -Dsonar.organization=1dd0rv
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.qualitygate.wait=true

  # RECON-813: escaneo de vulnerabilidades de la imagen final con Trivy.
  # Job separado y en paralelo a build: el Dockerfile hace su propio
  # 'mvn package' por dentro, meterlo como step secuencial duplicaria el build
  # Maven en el camino critico del pipeline.
  docker-scan:
    runs-on: ubuntu-latest

    # security-events: write es lo que permite subir el SARIF a la pestana
    # Security. Se declara aqui y no a nivel de workflow para que build siga
    # con el 'contents: read' minimo.
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # load: true deja la imagen en el daemon local para que Trivy la lea por
      # nombre; push: false, aqui no se publica nada. cache-from/to reutiliza
      # las capas (incluida la de dependencias Maven) entre runs.
      - name: Construir imagen
        uses: docker/build-push-action@v7.3.0
        with:
          context: backend/ticket-service
          push: false
          load: true
          tags: ticket-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Primero el SARIF con exit-code 0: asi el informe llega a la pestana
      # Security aunque el gate de abajo tumbe el job.
      - name: Trivy - informe SARIF (CRITICAL + HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ticket-service:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      - name: Subir SARIF a la pestana Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      # El gate real: solo CRITICAL tumba el job. Trivy lee automaticamente el
      # .trivyignore de la raiz del repo si existe, que es el mecanismo para
      # ignorar explicitamente una CVE concreta.
      - name: Trivy - quality gate (CRITICAL bloquea)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ticket-service:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          format: table
          exit-code: '1'
